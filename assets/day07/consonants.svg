<text class="note" x="40" y="1088">로마자는 위키백과 「Khmer script」 표의 UNGEGN(유엔 지명 표준) 열을</text>
<text class="note" x="40" y="1121">간단히 줄인 것이고, 한글 소리는 제작팀이 가장 비슷하게 어림한</text>
<text class="note" x="40" y="1154">값(추정)이에요. 크메르어에는 한글에 없는 소리(목청을 닫는 소리, 숨을</text>
<text class="note" x="40" y="1187">들이쉬듯 내는 ‘ㄷ’·‘ㅂ’ 소리 등)가 있어서 정확히 옮길 수 없어요. 계열이</text>
<text class="note" x="40" y="1220">달라도 첫소리가 같은 글자가 많아요(예: <tspan lang="km" class="kmf">ក</tspan>과 <tspan lang="km" class="kmf">គ</tspan>는 둘 다 ‘ㄲ’에 가까운</text>
<text class="note" x="40" y="1253">[k]). 두 계열의 진짜 차이는 뒤에 붙는 모음을 읽는 소리예요(a 계열 <tspan lang="km" class="kmf">ា</tspan>는</text>
<text class="note" x="40" y="1286">“아”, o 계열 <tspan lang="km" class="kmf">ា</tspan>는 “이어”).</text>
</svg>
