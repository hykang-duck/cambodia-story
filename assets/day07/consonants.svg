  #consonants .mkA { fill: #B45309; }
  #consonants .mkO { fill: #3E6A73; }
  #consonants .mkT { fill: #fff; font: 700 17px "Noto Sans KR", "Malgun Gothic", sans-serif; text-anchor: middle; }
  #consonants .km { fill: #2A211B; font: 400 52px "Leelawadee UI", "Khmer UI", sans-serif; text-anchor: middle; }
  #consonants .rom { fill: #2A211B; font: 700 28px "Noto Sans KR", "Malgun Gothic", sans-serif; text-anchor: end; }
  #consonants .han { fill: #5A4D43; font: 500 28px "Noto Sans KR", "Malgun Gothic", sans-serif; text-anchor: start; }
  #consonants .title { fill: #2A211B; font: 700 36px "Noto Sans KR", "Malgun Gothic", sans-serif; }
  #consonants .sub { fill: #5A4D43; font: 500 24px "Noto Sans KR", "Malgun Gothic", sans-serif; }
