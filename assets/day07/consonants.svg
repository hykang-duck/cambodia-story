<svg xmlns="http://www.w3.org/2000/svg" id="consonants" viewBox="0 0 920 1339" width="920" height="1339" role="img" aria-labelledby="t d">
<title id="t">크메르 문자 자음 33자 표</title>
<desc id="d">크메르 문자 자음 33자를 가로 5칸씩 늘어놓은 표. 칸마다 크메르 문자, 간이 로마자, 한글 근사 소리가 들어 있다. 자음은 a 계열(주황 테두리, 동그라미 표식)과 o 계열(청록 테두리, 네모 표식 및 점선 테두리)로 나뉜다.</desc>
