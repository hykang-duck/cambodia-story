<svg xmlns="http://www.w3.org/2000/svg" id="climate-phnompenh" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="t d">
<title id="t">프놈펜의 열두 달</title>
<desc id="d">프놈펜의 월별 강수량(막대)과 평균 최고·최저기온(선). 비는 5월 무렵부터 10월 무렵까지 많이 오고 9~10월에 가장 많으며, 가장 더운 달은 4월이다.</desc>
<style>
  #climate-phnompenh .bg { fill: #FFFFFF; }
  #climate-phnompenh .rainzone { fill: #E1ECEE; opacity: 0.6; }
  #climate-phnompenh .rainzone2 { fill: #E1ECEE; opacity: 0.25; }
  #climate-phnompenh .grid { stroke: #D9CDBB; stroke-width: 1; }
  #climate-phnompenh .axis { stroke: #5A4D43; stroke-width: 2; }
  #climate-phnompenh .bar { fill: #9DBDC4; stroke: #3E6A73; stroke-width: 2; }
  #climate-phnompenh .hi { fill: none; stroke: #B45309; stroke-width: 3.5; stroke-linejoin: round; }
  #climate-phnompenh .lo { fill: none; stroke: #7A5B3C; stroke-width: 3.5; stroke-dasharray: 9 6; stroke-linejoin: round; }
  #climate-phnompenh .mhi { fill: #B45309; stroke: #fff; stroke-width: 2; }
  #climate-phnompenh .mlo { fill: #fff; stroke: #7A5B3C; stroke-width: 3; }
  #climate-phnompenh .t { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #2A211B; font-size: 17px; font-weight: 500; }
  #climate-phnompenh .title { font-size: 26px; font-weight: 700; }
  #climate-phnompenh .ax-p { fill: #3E6A73; font-weight: 700; }
  #climate-phnompenh .ax-t { fill: #7C3A06; font-weight: 700; }
  #climate-phnompenh .mon { font-size: 18px; font-weight: 700; }
  #climate-phnompenh .halo { paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  #climate-phnompenh .lab-hi { fill: #7C3A06; font-weight: 700; }
  #climate-phnompenh .lab-lo { fill: #5A4D43; font-weight: 700; }
  #climate-phnompenh .lab-rain { fill: #2F535B; font-weight: 700; }
  #climate-phnompenh .band-rain { fill: #3E6A73; }
  #climate-phnompenh .band-dry { fill: #7A5B3C; }
  #climate-phnompenh .band-mix { fill: url(#cph-hatch); stroke: #5A4D43; stroke-width: 1; }
  #climate-phnompenh .band-t { fill: #fff; font-size: 17px; font-weight: 700; }
  #climate-phnompenh .small { fill: #5A4D43; font-size: 16px; font-weight: 500; }
</style>
